<main>
  <div [ngClass]="mode === 'Rest' ? 'rest-theme' : 'focus-theme'" class="timer-theme-container">
    <div class="mode-label">{{ mode }}</div>
    <h2>{{minutesToCountdownTime}}:{{secondsToCountdownTime | number:'2.0'}}</h2>

    <div *ngIf="editMode">
      <mat-form-field class="example-form-field">
        <mat-label>Minutes</mat-label>
        <input matInput type="number" min="0" max="59" [(ngModel)]="countdownMinutes" (ngModelChange)="updateCountdownTime()">
      </mat-form-field>
      <mat-form-field class="example-form-field">
        <mat-label>Seconds</mat-label>
        <input matInput type="number" min="0" max="59" [(ngModel)]="countdownSeconds" (ngModelChange)="updateCountdownTime()">
      </mat-form-field>
    </div>

    <div style="display: flex; justify-content: center; gap: 16px; margin-top: 24px;">
      <button mat-icon-button color="primary" aria-label="Pause/Resume" (click)="onPauseResume()">
        <span style="font-size: 2rem; line-height: 1;">{{ paused ? '▶' : '⏸' }}</span>
      </button>
      <button *ngIf="!editMode" mat-icon-button color="accent" (click)="onEditClick()" aria-label="Edit">
        <span style="font-size: 1.7rem; line-height: 1;">✎</span>
      </button>
      <button *ngIf="editMode" mat-stroked-button color="warn" (click)="onCancelEdit()">Cancel</button>
      <button mat-icon-button color="warn" aria-label="Skip" (click)="onSkip()">
        <span style="font-size: 2rem; line-height: 1;">⏭</span>
      </button>
    </div>
  </div>
</main>
